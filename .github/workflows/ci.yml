name: CI Build

# Build + typecheck + test workflow. Verifies the project builds cleanly, types
# check, and all unit and integration tests pass. Lint gates in lint.yml. No
# deploy, no secrets required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Placeholder for prisma schema validation (no DB connection made during generate)
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder

      # Lint runs (and gates) in lint.yml.
      - name: Type check
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test
        env:
          DATABASE_URL: postgresql://placeholder:***@localhost:5432/placeholder
          DASHBOARD_HOST: markup.ashbi.ca

      - name: Build
        run: npm run build
        env:
          # CI-safe defaults so the build doesn't depend on real env vars
          NODE_ENV: production
          CI: true

